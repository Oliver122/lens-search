name: auto-fix

on:
  push:
    branches:
      - "auto-feature/**"
    paths:
      - "GAPS.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Slug
        id: slug
        run: echo "slug=$(./scripts/slug-from-ref.sh "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"

      - name: Halt if missing-req is open
        run: |
          if git ls-remote --exit-code --heads origin "missing-req/${{ steps.slug.outputs.slug }}" >/dev/null; then
            echo "openAutoFix: halt, missing-req open"
            exit 1
          fi

      - name: openAutoFix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPEN_AUTO_FIX_PUSH: "1"
        run: ./scripts/open-auto-fix.sh "${{ steps.slug.outputs.slug }}"

      - name: Install Cursor CLI
        run: ./scripts/install-cursor-cli.sh

      - name: Hardener
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GIT_AUTHOR_NAME: auto-fix
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          OPEN_AUTO_FIX_PUSH: "1"
        run: |
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cursor/bin:$PATH"
          ./scripts/run-hardener.sh "${{ steps.slug.outputs.slug }}"

      - name: Merge fix into feature (same MR)
        env:
          OPEN_AUTO_FIX_PUSH: "1"
        run: ./scripts/merge-auto-fix.sh "${{ steps.slug.outputs.slug }}"
