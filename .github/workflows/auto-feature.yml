name: cycle

on:
  push:
    branches:
      - "req/**"
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: Feature slug
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve slugs
        id: slugs
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_SLUG: ${{ inputs.slug }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          slugs=""
          case "${EVENT}" in
            workflow_dispatch)
              slugs="${DISPATCH_SLUG}"
              ;;
            pull_request_review)
              slugs="$(bash ./scripts/slug-from-ref.sh "${REVIEW_HEAD}")"
              ;;
            schedule)
              slugs="$(git ls-remote --heads origin 'cycle/*' | awk -F/ '{print $NF}' | tr '\n' ' ')"
              ;;
            *)
              slugs="$(bash ./scripts/slug-from-ref.sh "${GITHUB_REF_NAME}")"
              ;;
          esac
          echo "slugs=${slugs}" >> "$GITHUB_OUTPUT"

      - name: Install Cursor CLI
        if: steps.slugs.outputs.slugs != ''
        run: bash ./scripts/install-cursor-cli.sh

      - name: Step cycle
        if: steps.slugs.outputs.slugs != ''
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: cycle
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: cycle
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cursor/bin:$PATH"
          chmod +x scripts/*.sh
          for slug in ${{ steps.slugs.outputs.slugs }}; do
            bash ./scripts/step-cycle.sh "$slug"
          done
