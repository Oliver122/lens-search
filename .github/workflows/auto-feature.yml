name: auto-feature

on:
  push:
    branches:
      - "req/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Slug from req branch
        id: slug
        run: |
          slug="$(./scripts/slug-from-ref.sh "${GITHUB_REF_NAME}")"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"

      - name: Skip if missing-req is open
        id: halt
        run: |
          if git ls-remote --exit-code --heads origin "missing-req/${{ steps.slug.outputs.slug }}" >/dev/null; then
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "openAutoFeature: skip, missing-req open"
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi

      - name: openAutoFeature
        if: steps.halt.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: auto-feature
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: auto-feature
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          OPEN_AUTO_FEATURE_PUSH: "1"
          OPEN_AUTO_FEATURE_MR: "1"
          OPEN_AUTO_FEATURE_BASE: main
        run: ./scripts/open-auto-feature.sh "${{ steps.slug.outputs.slug }}"

      - name: Install Cursor CLI
        if: steps.halt.outputs.open == 'true'
        run: ./scripts/install-cursor-cli.sh

      - name: Coder
        if: steps.halt.outputs.open == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GIT_AUTHOR_NAME: auto-feature
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          OPEN_AUTO_FEATURE_PUSH: "1"
          CURSOR_AGENT_MODEL: cursor-grok-4.6-medium
        run: |
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cursor/bin:$PATH"
          git show "${GITHUB_SHA}:scripts/run-coder.sh" > scripts/run-coder.sh
          chmod +x scripts/run-coder.sh
          ./scripts/run-coder.sh "${{ steps.slug.outputs.slug }}"

      # GITHUB_TOKEN pushes do not start other workflows. If coder wrote GAPS.md, harden here.
      - name: Auto-fix in-job when GAPS.md exists
        if: steps.halt.outputs.open == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GIT_AUTHOR_NAME: auto-fix
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          OPEN_AUTO_FIX_PUSH: "1"
          CURSOR_AGENT_MODEL: cursor-grok-4.6-medium
        run: |
          export PATH="$HOME/.cursor/bin:$PATH"
          slug="${{ steps.slug.outputs.slug }}"
          git checkout "auto-feature/${slug}"
          git show "${GITHUB_SHA}:scripts/run-hardener.sh" > scripts/run-hardener.sh
          chmod +x scripts/run-hardener.sh
          if [[ -f GAPS.md ]]; then
            ./scripts/open-auto-fix.sh "$slug"
            ./scripts/run-hardener.sh "$slug"
            ./scripts/merge-auto-fix.sh "$slug"
          fi
